<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Nested and Responsive Tables</title>
  
</head>
<body>
    <style>
    /* Wrapper: choti screen par table scroll karegi */
    .table-wrapper {
      overflow-x: auto;
      width: 100%;
    }

    table {
      border-collapse: collapse;
      font-family: serif;
    }

    th, td {
      border: 1px solid #333;
      padding: 10px 14px;
      text-align: center;
    }

    /* Nested table ke liye */
    .inner-table td,
    .inner-table th {
      padding: 8px 12px;
    }

    .nested-cell {
      padding: 0;
    }
  </style>

  <h2>Timetable</h2>

  <div class="table-wrapper">
    <table>
      <tr>
        <th>Day</th>
        <th>Lab Batches</th>
        <th>Faculty</th>
        <th>Room</th>
        <th>Time</th>
      </tr>

      <tr>
        <td>Friday</td>

        <!-- Cell ke andar table (nested) -->
        <td class="nested-cell">
          <table class="inner-table">
            <tr>
              <th>Batch</th>
              <th>System</th>
            </tr>
            <tr>
              <td>A1</td>
              <td>PC 1-20</td>
            </tr>
            <tr>
              <td>A2</td>
              <td>PC 21-40</td>
            </tr>
          </table>
        </td>

        <td>Dr. Sharma</td>
        <td>Lab 2</td>
        <td>2-4 PM</td>
      </tr>
    </table>
  </div>

</body>
</html>

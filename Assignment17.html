<!DOCTYPE html>
<html>
<head>
  <title>Assignment 17</title>
</head>
<body>
  <form action="submit.html" method="post">
    <p>
      <input type="text" name="fullname" placeholder="Full name"
             required minlength="3" maxlength="50">
    </p>
    <p>
      <input type="email" name="email" placeholder="you@college.edu"
             required pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.edu">
    </p>
    <p>
      <input type="tel" name="mobile" placeholder="10-digit mobile"
             required pattern="[0-9]{10}" maxlength="10">
    </p>
    <p>
      <input type="password" name="password" placeholder="Min 6 characters"
             required minlength="6">
    </p>
    <p>
      <input type="number" name="age" placeholder="Age (17-60)"
             required min="17" max="60">
    </p>
    <p>
      <button type="submit">Register</button>
    </p>
  </form>
</body>
</html>

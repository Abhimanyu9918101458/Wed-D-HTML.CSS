<!DOCTYPE html>
<html lang="en">
<head>
 
  <title>ABC College Admission 2026</title>
  <style>
    body { margin: 0; font-family: Georgia, serif; }
    header, footer {
      background: #1a7e7e;
      color: rgb(255, 255, 255);
      text-align: center;
      padding: 20px;
    }
    header h1 { margin: 0; }
    main { padding: 20px 40px; }
    table { border-collapse: collapse; width: 100%; max-width: 700px; }
    th, td { border: 1px solid #999; padding: 8px; text-align: left; }
    th { background: #e8eaf6; text-align: center; }
    fieldset { margin-top: 20px; max-width: 700px; }
    label { display: block; margin-top: 10px; }
    input[type="text"], input[type="email"] { width: 300px; }
    textarea { width: 100%; max-width: 540px; }
    button { margin-top: 20px; padding: 6px 10px; }
  </style>
</head>
<body>

  <header>
    <h1>ABC College Admission 2026</h1>
  </header>

  <main>
    <h2>Courses and Fees</h2>

    <table>
      <caption>Available Courses</caption>
      <tr>
        <th>Course</th>
        <th>Seats</th>
        <th>Fees</th>
      </tr>
      <tr>
        <td>B.Tech CSE</td>
        <td>120</td>
        <td>₹90,000</td>
      </tr>
      <tr>
        <td>BCA</td>
        <td>60</td>
        <td>₹45,000</td>
      </tr>
    </table>

    <form>
      <fieldset>
        <legend>Application Form</legend>

        <label for="name">Name:</label>
        <input type="text" id="name">

        <label for="email">Email:</label>
        <input type="email" id="email">

        <label for="course">Course:</label>
        <select id="course">
          <option>B.Tech CSE</option>
          <option>BCA</option>
        </select>

        <label for="statement">Statement:</label>
        <textarea id="statement" rows="4"></textarea>

        <br>
        <button type="submit">Apply</button>
      </fieldset>
    </form>
  </main>

  <footer>&copy; 2026 ABC College</footer>

</body>
</html>

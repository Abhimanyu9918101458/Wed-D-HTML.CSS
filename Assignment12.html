<!DOCTYPE html> 
<html> 
    <head>
        <title>Table with Headers,Caption and Footer</title>
    </head>
    <body>
        <table border="1">
            <caption>Student Marks</caption>
            <thead>
                <tbody>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>marks</th>
                </tr>
            </thead>
            <tr>
                <td>1</td>
                <td>Abhimanyu yadav</td>
                <td>85</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Riya</td>
                <td>92</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Average</td>
                <td>88.5</td>
            </tr>
        </tfoot>
        </table>
    </body>
    </html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 7: Navigation Menu Using Lists</title>
  <style>
    ul.menu {
      list-style: none;
      margin: 0;
      padding: 0;
      background-color: #333;
      overflow: hidden;
    }
    ul.menu li {
      float: left;
    }
    ul.menu li a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 14px 20px;
    }
  </style>
</head>
<body>

  <ul class="menu">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Courses</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

</body>
</html>

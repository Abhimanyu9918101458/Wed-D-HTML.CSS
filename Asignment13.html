<!DOCTYPE html>
<html>
    <head>
        <title>Rowspan and Colspan(Time Table)</title>
    </head>
    <body>
        <table border="1">
                <caption>Weekly Time Table</caption>
                <thead>
                    <tbody>
                        <tr>
                            <th>Day</th>
                            <th>9-10</th>
                            <th>10-11</th>
                            <th>11-12</th>
                        </tr>
                </thead>
                <tr>
                    <td>Mon</td>
                    <td>Maths</td>
                    <td>HTML</td>
                    <td rowspan="2">Wed Lab</td>
                </tr>
                <tr>
                    <td>Tue</td>
                    <td>DBMS</td>
                    <td>OS</td>
                    </tr>
                    <tr>
                    <td>Wed</td>
                    <td colspan="3"> Seminar</td>
                    </tr>
                </tbody>

    </body>
</html>
